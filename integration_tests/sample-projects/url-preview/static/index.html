<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>URL Preview</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
    form { display: flex; gap: 0.5rem; }
    input[type="url"] { flex: 1; padding: 0.5rem; font-size: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    #result { margin-top: 1.5rem; white-space: pre-wrap; word-break: break-word; }
    .error { color: #b00020; }
    dt { font-weight: bold; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>URL Preview</h1>
  <form id="preview-form">
    <input type="url" id="url" placeholder="https://example.com" required>
    <button type="submit">Preview</button>
  </form>
  <div id="result"></div>

  <script>
    const form = document.getElementById('preview-form');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const url = document.getElementById('url').value;
      result.textContent = 'Loading...';
      result.classList.remove('error');

      try {
        const response = await fetch('/preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'request failed');
        }

        result.innerHTML = `
          <dl>
            <dt>Title</dt><dd>${escapeHtml(data.title)}</dd>
            <dt>Description</dt><dd>${escapeHtml(data.description)}</dd>
            <dt>Status</dt><dd>${data.status}</dd>
            <dt>Final URL</dt><dd>${escapeHtml(data.final_url)}</dd>
            <dt>Response time</dt><dd>${data.response_time_ms} ms</dd>
          </dl>`;
      } catch (err) {
        result.classList.add('error');
        result.textContent = 'Error: ' + err.message;
      }
    });

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = value || '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
